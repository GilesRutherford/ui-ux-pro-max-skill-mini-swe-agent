name: Tests

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'cli/assets/skills/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run skill regression tests
        run: python -m pytest .claude/skills -v

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        working-directory: cli
        run: npx playwright install --with-deps chromium

      - name: Run preview end-to-end smoke test
        working-directory: cli
        run: npx playwright test tests/e2e/preview.spec.ts

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: cli/playwright-report/
          retention-days: 30
